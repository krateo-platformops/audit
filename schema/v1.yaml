# Krateo AuditEvent schema, version 1 (krateo-platformops/installer#716).
#
# THE schema: one entry per attribute an audit record may carry. Nothing else
# may appear on a record (the closed set). Go writers get their key constants
# and the checker's rules from this file through `go generate` (schema_gen.go);
# non-Go writers validate against it with cmd/auditschema.
#
# Writer classes (who records the event):
#   request    (H) a request a component served for a caller: snowplow's, and
#                  authn's login and /delegate
#   gateway    (G) the agent gateway's hop record (the collector projection)
#   action     (T) an agent's per-action record, written by whatever performs it
#   controller (C) a controller reconcile
#
# Requirement levels, per writer class:
#   required          the key is on every record of that writer
#   conditional       required when `when` holds. With `check`, the checker
#                     evaluates the condition on the record itself; without it,
#                     the condition is not visible on the record and the checker
#                     treats the key as optional, unless `markable`
#   optional          may be written
#   not_established   this writer cannot know it: it is never written, and the
#                     per-action record carries it
#   not_applicable    the fact does not exist for this writer
#
# `values: [...]` on a writer's requirement is the closed set of values that
# writer may write, for a key whose values depend on the writer (the key then
# has no key-level `values`, and every writer that may write it declares its
# own). Check reports any other value as bad-enum. A writer gains a value, or
# a writer gains the key, in a minor release.
#
# `actions: {<krateo.action>: [...]}` on a writer's requirement is the closed
# set per action instead: the values that writer may write for the key on a
# record whose krateo.action is that action. Such a key has no key-level
# `values` and no per-writer `values`. Check reports a value outside the
# record's action's set as bad-enum, and the key on a record whose action
# declares no set (krateo.action absent included) as not-for-action. An
# action gains a value, or the key gains an action, in a minor release.
#
# `markable: true` means a writer that cannot establish the key omits it and
# names its `marker` in krateo.audit.incomplete. The checker reports such a
# record as incomplete, not as missing the key. A conditional key that is
# markable but has no `check` must be either present or marked.
#
# `identity: true` keys carry who someone is, on purpose (the audit trail is
# identity-bearing by design). They never reach a span or an ordinary log line.
# `asserted: true` keys hold a value a client chose: never identity, never a
# policy key. They, and only they, live under krateo.audit.asserted. (a
# header the gateway saw) or krateo.audit.client. (provenance a client sent
# the writer, snowplow#1333).
#
# `only_when: <condition>` means the key may be written only while that
# condition holds; the checker reports it, as unexpected, anywhere else.
# `not_when: <condition>` is the converse: the key is never written while the
# condition holds, and the checker reports it there as unexpected.
#
# `credential_free: true` means the key is never written on a record whose
# Kubernetes target is one of `credential_targets`; the checker reports it
# there as not-for-target.
#
# `minimum: <n>` bounds an int key from below, and `less_than: <key>` bounds
# it by another int key on the same record; the checker reports a value
# outside the bound as out-of-range.
#
# Keys with `replaced_by` are the v0.3 names, written side by side with their
# replacement during migration window W1 (library v0.4.x and v0.5.x) and
# removed by the release that closes W1, once the data shows no row and no
# reader still needs them. Such a key takes its replacement's writer levels,
# as optional: it is allowed wherever its replacement is, must hold the same
# value, and is never written without it. Emit adds each one beside its
# replacement unless the key says `dual_write: false` (enduser.id: written
# only where it is written today, never added).
#
# Emit never drops a record. A record missing a key its writer must write is
# emitted without it and names the key's marker in krateo.audit.incomplete;
# Check reports it as incomplete.

updated: "2026-11-12T00:00:00Z" # the generated docs/schema.md timestamp
schema_version: "1"
event_name: audit

writers:
  - id: request
    code: H
    go: WriterRequest
    description: >-
      A request a component served for a caller, recorded by that component:
      snowplow for a person's or an agent's request, authn for a login and a
      /delegate token.
  - id: gateway
    code: G
    go: WriterGateway
    description: The agent gateway's hop record, projected by the collector.
  - id: action
    code: T
    go: WriterAction
    description: An agent's per-action record, written by whatever performs the action.
  - id: controller
    code: C
    go: WriterController
    description: A controller reconcile.

# Conditions the checker evaluates on the record alone.
conditions:
  - id: k8s_target
    go: CondK8sTarget
    description: >-
      The record names a Kubernetes object: k8s.namespace.name or any
      krateo.audit.object_ref.* key is present.
  - id: write
    go: CondWrite
    description: >-
      krateo.audit.verb is a write: create, update, patch, delete,
      deletecollection (a Kubernetes object), post or put (anything else).
  - id: method_other
    go: CondMethodOther
    description: >-
      http.request.method is _OTHER: the writer was given a method semconv
      does not name.
  - id: delegated
    go: CondDelegated
    description: >-
      The record carries a delegation: krateo.audit.delegation or
      krateo.audit.on_behalf_of.user.name is present.
  - id: impersonated
    go: CondImpersonated
    description: >-
      The record carries an impersonation: either
      krateo.audit.impersonated_user.* key is present.
  - id: caused
    go: CondCaused
    description: >-
      The record names the object a controller reconciled: any
      krateo.audit.cause_ref.* key is present.
  - id: denied
    go: CondDenied
    description: >-
      krateo.audit.outcome is denied: the writer itself refused.
  - id: content_write
    go: CondContentWrite
    description: >-
      krateo.audit.verb creates or replaces an object's content: create or
      update.
  - id: client_rejected
    go: CondClientRejected
    description: >-
      The writer rejected the client's provenance header:
      krateo.audit.client.rejected is present.
  - id: client_provenance
    go: CondClientProvenance
    description: >-
      The record carries provenance the client asserted: a
      krateo.audit.client.* key other than source and rejected is present.
  - id: confirmed_set
    go: CondConfirmedSet
    description: >-
      The record names the confirmed set its write belongs to: any
      krateo.audit.client.confirmed_set.* key is present.
  - id: succeeded
    go: CondSucceeded
    description: >-
      krateo.audit.outcome is success: the authority answered and the action
      completed.

# Exactly one target per record: a Kubernetes object or an external endpoint.
# A controller's record may name both: the object it wrote in object_ref and
# the endpoint it wrote to in server.address (a v0.4 controller record named
# the object it reconciled in object_ref beside the endpoint; v0.5 names that
# object in cause_ref), so it needs at least one.
target:
  marker: target
  keys: [krateo.audit.object_ref.resource, server.address]
  writers:
    request: exactly_one
    gateway: exactly_one
    action: exactly_one
    controller: at_least_one

# The Kubernetes targets that carry a credential: a key marked
# `credential_free` is never written on a record whose object_ref names one.
# An entry without a subresource matches the resource and every subresource
# of it; one with a subresource matches that subresource only. api_group ""
# is the core group (object_ref.api_group omitted).
#
# What was checked (2026-11-11), and why each is in or out:
#   in   secrets: data and stringData hold the secret itself.
#   in   serviceaccounts/token: the TokenRequest's status.token is a bearer.
#        TokenRequest is served only as this subresource; there is no
#        tokenrequests resource to list.
#   in   tokenreviews.authentication.k8s.io: spec.token is the bearer under
#        review.
#   out  selfsubjectreviews.authentication.k8s.io: the body carries no token
#        (the caller's own credential is in the request headers).
#   out  subjectaccessreviews, selfsubjectaccessreviews,
#        localsubjectaccessreviews.authorization.k8s.io: identity, no
#        credential.
#   out  certificatesigningrequests.certificates.k8s.io: spec.request is a CSR
#        and status.certificate the issued certificate, both public; the
#        private key never reaches the apiserver.
#   out  webhook configurations and apiservices: caBundle is a public CA.
#   out  authn's CRDs (users.basic, ldapconfigs, oauthconfigs, oidcconfigs,
#        serviceaccounts.serviceaccount.authn.krateo.io, authn@26c4456d):
#        every credential field is a reference to a Secret key
#        (passwordRef, bindSecret, clientSecretRef, clientSecret), never the
#        value.
credential_targets:
  - {api_group: "", resource: secrets}
  - {api_group: "", resource: serviceaccounts, subresource: token}
  - {api_group: authentication.k8s.io, resource: tokenreviews}

# The annotations that are content (krateo.audit.object_ref.content_sha256):
# authorization reads them, so a write that changes one changes what an
# identity may do, as the AUDIT-4 ruling counts it. Every other annotation,
# and every label, is metadata and is not hashed. The one declared list,
# collected from:
#   - authn's storage.AuthorizationAnnotations (authn@26c4456d,
#     go/authn/internal/helpers/kube/config/storage/identity.go):
#     authn.krateo.io/strategy, authn.krateo.io/groups;
#   - plumbing's helm/v3/verdicts.go (plumbing@3a581c7d) declares none: its
#     canonicalContent counts no label or annotation.
content_annotations:
  - authn.krateo.io/strategy
  - authn.krateo.io/groups

# Where each writer's records land in default.krateo_audit, by the
# instrumentation scope name of the logger it emits on. Used by
# `auditschema sql` to build the live conformance queries. The generator
# refuses a scope listed twice: the queries judge a scope's rows by the one
# writer it is listed under, so a component that writes for two classes, like
# authn, emits each on its own scope.
populations:
  - scope: github.com/krateo-platformops/snowplow/audit
    writer: request
    who: snowplow (H, and T for an agent going through /call)
  - scope: github.com/krateo-platformops/authn/audit
    writer: request
    who: authn's login and /delegate records
  - scope: github.com/krateo-platformops/authn/audit/controller
    writer: controller
    who: authn's background credential writes (certificate renewal, the step-up Secret sweep)
  - scope: github.com/krateo-platformops/observability/gateway-audit
    writer: gateway
    who: the collector's gateway-audit projection
  - scope: github.com/krateo-platformops/access-review/audit
    writer: controller
    who: access-review
  - scope: github.com/krateo-platformops/identity-lifecycle/audit
    writer: controller
    who: identity-lifecycle
  - scope: github.com/krateo-platformops/audit
    writer: controller
    who: >-
      access-review and identity-lifecycle before each moved to its own scope
      (split by ServiceName); kept for their historical rows
  - scope: rest-dynamic-controller/audit
    writer: controller
    who: rest-dynamic-controller
  - scope: github.com/krateo-platformops/composition-dynamic-controller/audit
    writer: controller
    who: >-
      the composition-dynamic-controller's helm writes to a Composition's
      children (one record per child installed, upgraded, pruned or kept)
    note: >-
      The composition-dynamic-controller runs one Deployment per
      CompositionDefinition version, each with its own ServiceName, and every
      one emits on this scope: select its rows by scope, not by ServiceName.
  - scope: github.com/krateo-platformops/core-provider/audit
    writer: controller
    who: >-
      core-provider's *.krateo.io spec writes (authn mapping, spoke mirror
      Compositions, hub delete) and its RBAC and credential-Secret writes

# Rows written before this schema, kept as the positive control of the live
# query: they carry no krateo.audit.schema_version and no event.name attribute.
legacy_controls:
  - scope: request
    writer: gateway
    who: the agent gateway's pre-2026-10-22 access-log rows

keys:
  # --- discriminator and schema -------------------------------------------
  - name: event.name
    go: EventName
    type: string
    semconv: deprecated
    values: [audit]
    description: >-
      The discriminator the collector partitions on. Also set as the LogRecord
      EventName; the attribute stays until the collector partitions on
      EventName and krateo_audit has an EventName column.
    writers: {request: required, gateway: required, action: required, controller: required}

  - name: krateo.audit.schema_version
    go: SchemaVersion
    type: string
    semconv: none
    values: ["1"]
    description: The schema version the record was written to. Tells migrated rows apart.
    writers: {request: required, gateway: required, action: required, controller: required}

  # --- who -----------------------------------------------------------------
  - name: user.name
    go: UserName
    type: string
    semconv: development
    identity: true
    description: >-
      The principal performing the action (Kubernetes user.username). On a
      delegated token, the outermost actor. For a controller,
      system:serviceaccount:<namespace>:<name>. A writer that names no
      actor still emits the record, without this key and marked actor: a
      record is never dropped.
    marker: actor
    writers:
      request: {level: required, markable: true}
      gateway: {level: required, markable: true}
      action: {level: required, markable: true}
      controller: {level: required, markable: true}

  - name: user.roles
    go: UserRoles
    type: string[]
    semconv: development
    identity: true
    description: The groups of the principal in user.name (Kubernetes user.groups).
    writers:
      request: {level: conditional, when: the token carries groups}
      gateway: {level: conditional, when: the token carries groups}
      action: {level: conditional, when: the token carries groups}
      controller: optional

  - name: krateo.audit.actor_class
    go: ActorClass
    type: string
    semconv: none
    values: [human, agent, controller, service]
    marker: actor_class
    description: >-
      The class of the principal in user.name, as its credential proves it:
      authn's signed `principal` claim (UserInfo.ActorPrincipal()). Omitted,
      never defaulted, when the claim is absent or unknown. Under
      TOKEN_PASSTHROUGH an agent replays a person's token, so the class is
      human; only a /delegate token names the agent.
    writers:
      request: {level: conditional, when: the token carries a known principal claim, markable: true}
      gateway: {level: conditional, when: the token carries a known principal claim, markable: true}
      action: required
      controller: required

  - name: krateo.audit.on_behalf_of.user.name
    go: OnBehalfOf
    type: string
    semconv: none
    identity: true
    description: >-
      On a delegated token, the person the actor acts for (the token's sub).
      Read only from a signed act chain, never from baggage.
    writers:
      request: {level: conditional, when: the token carries a signed act chain, check: delegated}
      gateway: {level: conditional, when: the token carries a signed act chain, check: delegated}
      action: {level: conditional, when: the token carries a signed act chain, check: delegated}
      controller: optional

  - name: krateo.audit.delegation
    go: Delegation
    type: string[]
    semconv: none
    identity: true
    format: delegation_link
    description: >-
      The signed act chain, outermost actor first and ending with the subject,
      each entry <class>:<subject>. A link whose class is unknown is written
      :<subject>.
    writers:
      request: {level: conditional, when: the token carries a signed act chain, check: delegated}
      gateway: {level: conditional, when: the token carries a signed act chain, check: delegated}
      action: {level: conditional, when: the token carries a signed act chain, check: delegated}
      controller: optional

  - name: krateo.audit.impersonated_user.name
    go: ImpersonatedUser
    type: string
    semconv: none
    identity: true
    description: The user the writer impersonated (Kubernetes impersonatedUser.username).
    writers:
      request: {level: conditional, when: the writer impersonated, check: impersonated}
      gateway: not_established
      action: {level: conditional, when: the writer impersonated, check: impersonated}
      controller: {level: conditional, when: the writer impersonated, check: impersonated}

  - name: krateo.audit.impersonated_user.roles
    go: ImpersonatedRoles
    type: string[]
    semconv: none
    identity: true
    description: The groups the writer impersonated (Kubernetes impersonatedUser.groups).
    writers:
      request: {level: conditional, when: the writer impersonated with groups}
      gateway: not_established
      action: {level: conditional, when: the writer impersonated with groups}
      controller: {level: conditional, when: the writer impersonated with groups}

  - name: krateo.audit.affected_user.name
    go: AffectedUser
    type: string
    semconv: none
    identity: true
    description: >-
      The user the action was done TO, when that is not the actor: separates
      "done to alice" from "done by alice". Never equal to user.name.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: optional
      controller: {level: conditional, when: the object is about a user}

  # --- what ----------------------------------------------------------------
  - name: krateo.action
    go: Action
    type: string
    semconv: none
    marker: action
    description: >-
      The emit site's logical action, a literal of the writer (call, export,
      restaction, rest.write, gateway.<backend type>). Not the verb.
    writers:
      request: {level: required, markable: true}
      gateway: required
      action: {level: required, markable: true}
      controller: {level: required, markable: true}

  - name: krateo.audit.verb
    go: Verb
    type: string
    semconv: none
    values: [get, list, watch, create, update, patch, delete, deletecollection, head, post, put, options]
    marker: verb
    description: >-
      The verb as the apiserver derives it (RequestInfoFactory) for a
      Kubernetes target; for anything else the lowercase method (the
      apiserver's non-resource rule). Omitted and marked when the method is
      not recognised.
    writers:
      request: {level: required, markable: true}
      gateway: {level: required, markable: true}
      action: {level: required, markable: true}
      controller: {level: required, markable: true}

  - name: http.request.method
    go: HTTPMethod
    type: string
    semconv: stable
    values: [CONNECT, DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT, QUERY, TRACE, _OTHER]
    marker: method
    description: >-
      The HTTP method the writer sent or proxied, derived from the verb of the
      authority request the writer sent: for a Kubernetes target, create is
      POST, update PUT, patch PATCH, delete DELETE, get GET. Never the method
      of the request the writer served (krateo.request.uri records what it
      received). A writer that knows no verb omits it and marks it. _OTHER
      for a method semconv does not name (lowercase included), with the
      method as given in http.request.method_original.
    writers:
      request: {level: required, markable: true}
      gateway: {level: required, markable: true}
      action: {level: conditional, when: the action was an HTTP request}
      controller: {level: conditional, when: the action was an HTTP request}

  - name: http.request.method_original
    go: HTTPMethodOriginal
    type: string
    semconv: stable
    description: >-
      The HTTP method exactly as the writer was given it, when
      http.request.method records it as _OTHER. Written only then, so no
      value a writer passes is lost. Semconv also lets a framework that
      treats methods as case-insensitive pair a canonical method with its
      original; this schema does not: a method semconv does not name,
      lowercase included, is _OTHER.
    only_when: method_other
    writers:
      request: {level: conditional, when: http.request.method is _OTHER, check: method_other}
      gateway: {level: conditional, when: http.request.method is _OTHER, check: method_other}
      action: {level: conditional, when: http.request.method is _OTHER, check: method_other}
      controller: {level: conditional, when: http.request.method is _OTHER, check: method_other}

  - name: krateo.audit.dry_run
    go: DryRun
    type: bool
    semconv: none
    description: >-
      true when the write was validated and not persisted (Kubernetes
      dryRun=All, or an endpoint's own dry run), false for a write meant to
      persist. On every write record of a writer that serves requests or
      performs actions; never on a read. Readers use this key, not a suffix on
      krateo.action.
    only_when: write
    writers:
      request: {level: conditional, when: the record is a write, check: write}
      gateway: not_established
      action: {level: conditional, when: the record is a write, check: write}
      controller: not_applicable

  - name: krateo.audit.outcome
    go: Outcome
    type: string
    semconv: none
    values: [success, failure, denied]
    description: >-
      What the authority this writer sent to answered, at the protocol level
      the writer observes. denied means the writer itself refused;
      krateo.audit.denial_reason may say why.
    writers: {request: required, gateway: required, action: required, controller: required}

  - name: krateo.audit.denial_reason
    go: DenialReason
    type: string
    semconv: none
    description: >-
      Why the writer itself refused, on a denied record only: one of the
      closed values its writer class declares, never free text. The caller's
      answer can stay opaque while the audit reader gets the reason. Optional:
      a denied record without it conforms. A writer class with no declared
      value cannot write it.
    only_when: denied
    writers:
      # authn's refusals; authn owns each value's meaning. The first six are
      # authn 0.41.0's name guard: name_claimed includes the write-time race
      # re-check; name_held_legacy is a pre-claims Secret written by a different
      # strategy (no claim exists, so it is not name_claimed).
      # group_not_allowed: an OIDCConfig's allowedGroups refused an identity the
      # IdP verified, because it is in none of the admitted groups (403
      # GroupNotAllowed).
      # delegation_not_allowed, delegation_too_deep: authn's /delegate refused
      # the token exchange: the actor may not act for the subject, or the act
      # chain would exceed its depth bound (authn#123).
      # platform_group: an identity source (LDAP, OAuth, OIDC) asserted a
      # krateo: group, which only the platform grants (403). Not system_group,
      # which is a Kubernetes system: group.
      # name_missing: an identity source verified the identity but returned no
      # username (an OIDC claim absent or empty, an OAuth RESTAction with no
      # username, an LDAP entry with no uid), so authn refuses it (403). With
      # no username there is no credential Secret to name: the record names
      # the Secret resource without its name, and carries no status code.
      # subject_token_expired, subject_token_invalid: authn's /delegate
      # verified the actor but refused the subject token (audit#18). The
      # caller's answer is one cause either way (401 SubjectTokenInvalid);
      # the record keeps the two apart, and carries no status code.
      # subject_token_expired: the token verified but has expired, or expires
      # within authn's 1 s margin. Routine.
      # subject_token_invalid: the token did not verify: a bad signature, an
      # unknown or retired kid (a key retired to revoke tokens included),
      # malformed, a wrong alg, or no exp. Security-relevant.
      # authn's refusals after the identity verified (audit#20, authn#132),
      # each a denied record with no status code. The meanings are authn's
      # own (authn@9e352bde):
      # POST /oidc/stepup, after the ID token verified (oidc/stepup.go,
      # checkStepUp):
      #   stepup_not_enabled (StepUpNotEnabled): "step-up is not enabled for
      #   this OIDCConfig (spec.stepUp)".
      #   insufficient_assurance (InsufficientAssurance): the ID token's acr
      #   "is not one of" the step-up's configured acr values.
      #   stale_authentication (StaleAuthentication): the "ID token has no
      #   auth_time, so the authentication's age is unknown", or it
      #   authenticated longer ago "than the step-up allows" (maxAge).
      # POST /serviceaccount/login, after the TokenReview authenticated the
      # caller (serviceaccount/login.go, validate; resolvers/serviceaccount.go):
      #   not_a_service_account (NotAServiceAccount): the authenticated
      #   username is not a ServiceAccount's
      #   (system:serviceaccount:<namespace>:<name>).
      #   no_mapping (NoMapping): "no ServiceAccount mapping", an allowlist
      #   miss: no mapping's spec.serviceAccountRef names the ServiceAccount,
      #   so it may not exchange its token.
      #   ambiguous_mapping (AmbiguousMapping): "ambiguous ServiceAccount
      #   mapping": more than one mapping names it.
      #   The ServiceAccount cases name the mapping resource without a name,
      #   as name_missing names the Secret resource. authn's POST
      #   /usernames/check (krateo.action authn.username.check, audit#23)
      #   refuses its caller with the same three reasons, the same way.
      # POST /usernames/check, after the TokenReview passed and one mapping
      # admits the ServiceAccount (audit#23):
      #   username_check_not_allowed: the mapping has not opted in
      #   (spec.usernameCheck.allowed), so authn refuses the check (403). The
      #   record names the checked name's clientconfig Secret, carries no
      #   status code, and no check_result: the check never ran.
      #   invalid_request (audit#29, authn#136): a verified, mapped and
      #   opted-in caller sent a body with no username, or one that isn't
      #   JSON, so authn answers 400 and the check never runs. Denied, no
      #   status code, no check_result. With no username there is no Secret
      #   to name: the record names the Secret resource without a name, as
      #   name_missing does.
      # Not denial reasons:
      #   AudienceMismatch is part of verifying the token, so it is a counted
      #   pre-verification refusal and never a row.
      #   MappingLookupFailed is a failure row. Its status code is the
      #   apiserver's answer to the mapping lookup when it answered (a 403 or
      #   5xx from the list call), and omitted when nothing answered (a
      #   timeout, a refused connection).
      #   StepUpMisconfigured is a failure row with no status code: no
      #   authority answered. authn's own HTTP status (500) is never
      #   http.response.status_code.
      request: {level: optional, values: [name_reserved, name_claimed, name_held_legacy, name_provisioned, name_bound, system_group, group_not_allowed, delegation_not_allowed, delegation_too_deep, platform_group, name_missing, subject_token_expired, subject_token_invalid, stepup_not_enabled, insufficient_assurance, stale_authentication, no_mapping, ambiguous_mapping, not_a_service_account, username_check_not_allowed, invalid_request]}
      gateway: not_applicable
      action: not_applicable
      # kept_resource_policy: helm declined a delete because the object carries
      # helm.sh/resource-policy: keep (verb delete, outcome denied).
      controller: {level: optional, values: [kept_resource_policy]}

  - name: krateo.audit.check_result
    go: CheckResult
    type: string
    semconv: none
    description: >-
      What a check the writer ran for the caller concluded, when the record's
      action is a check: one of the closed values its krateo.action declares,
      never free text. It is the check's answer, not the record's outcome: a
      check that completed is a success whatever it concluded. Optional: a
      record without it conforms. Only on a success, when the check ran: a
      denied record (the check never ran) and a failure (the lookup failed)
      carry none. An action with no declared set cannot write it.
    only_when: succeeded
    writers:
      # authn.username.check (audit#23): authn's POST /usernames/check, which
      # identity-lifecycle's AccessRequest controller calls to learn whether a
      # username is free. The record is a request row, verb get, targeting
      # the clientconfig Secret the name guard protects; outcome success when
      # the check completed, failure when a lookup failed, never denied.
      # authn owns each value's meaning: available, or the name guard's
      # answer (reserved, name_claimed, name_held_legacy, name_provisioned,
      # name_bound), or invalid.
      request: {level: optional, actions: {authn.username.check: [available, reserved, name_claimed, name_held_legacy, name_provisioned, name_bound, invalid]}}
      gateway: not_applicable
      action: not_applicable
      controller: not_applicable

  - name: http.response.status_code
    go: HTTPStatusCode
    type: int
    semconv: stable
    description: >-
      The status code the authority answered (Kubernetes responseStatus.code).
      Never on a denied record: denied means the writer itself refused, so no
      authority answered.
    not_when: denied
    writers:
      request: {level: conditional, when: the authority answered}
      gateway: {level: conditional, when: the backend answered}
      action: {level: conditional, when: the authority answered}
      controller: {level: conditional, when: the action was an HTTP request that was answered}

  - name: krateo.audit.preview
    go: Preview
    type: bool
    semconv: none
    marker: preview
    description: >-
      true when the target is a namespaced Kubernetes object whose Namespace
      carries the label krateo.io/purpose=preview-sandbox, read by the writer
      from apiserver state. false for any other Kubernetes target, a
      cluster-scoped one included (installer#716 §2.4). Omitted and marked
      when the Namespace could not be read. Not written for an external
      endpoint alone. Not a retention key, not a filter.
    writers:
      request: {level: conditional, when: the target is a Kubernetes object (false when cluster-scoped), check: k8s_target, markable: true}
      gateway: not_established
      action: {level: conditional, when: the target is a Kubernetes object (false when cluster-scoped), check: k8s_target, markable: true}
      controller: {level: conditional, when: the target is a Kubernetes object (false when cluster-scoped), check: k8s_target, markable: true}

  # --- which target: a Kubernetes object ------------------------------------
  - name: krateo.audit.object_ref.api_group
    go: ObjectAPIGroup
    type: string
    semconv: none
    description: The object's API group (objectRef.apiGroup). Omitted for the core group.
    writers:
      request: {level: conditional, when: Kubernetes target outside the core group}
      gateway: not_established
      action: {level: conditional, when: Kubernetes target outside the core group}
      controller: {level: conditional, when: Kubernetes target outside the core group}

  - name: krateo.audit.object_ref.api_version
    go: ObjectAPIVersion
    type: string
    semconv: none
    description: The object's API version (objectRef.apiVersion).
    writers:
      request: {level: conditional, when: Kubernetes target, check: k8s_target}
      gateway: not_established
      action: {level: conditional, when: Kubernetes target, check: k8s_target}
      controller: {level: conditional, when: Kubernetes target, check: k8s_target}

  - name: krateo.audit.object_ref.resource
    go: ObjectResource
    type: string
    semconv: none
    description: The object's resource, the plural (objectRef.resource). Every Kubernetes target names it.
    writers:
      request: {level: conditional, when: Kubernetes target, check: k8s_target}
      gateway: not_established
      action: {level: conditional, when: Kubernetes target, check: k8s_target}
      controller: {level: conditional, when: Kubernetes target, check: k8s_target}

  - name: krateo.audit.object_ref.subresource
    go: ObjectSubresource
    type: string
    semconv: none
    description: The addressed subresource (objectRef.subresource), e.g. status.
    writers:
      request: {level: conditional, when: a subresource was addressed}
      gateway: not_established
      action: {level: conditional, when: a subresource was addressed}
      controller: {level: conditional, when: a subresource was addressed}

  - name: krateo.audit.object_ref.name
    go: ObjectName
    type: string
    semconv: none
    description: The object's name (objectRef.name).
    writers:
      request: {level: conditional, when: the target is a named object}
      gateway: not_established
      action: {level: conditional, when: the target is a named object}
      controller: {level: conditional, when: the target is a named object}

  - name: k8s.namespace.name
    go: Namespace
    type: string
    semconv: stable
    description: The object's namespace (objectRef.namespace). sse-proxy scopes tenants by it.
    writers:
      request: {level: conditional, when: the target is namespaced}
      gateway: not_established
      action: {level: conditional, when: the target is namespaced}
      controller: {level: conditional, when: the target is namespaced}

  - name: krateo.audit.object_ref.kind
    go: ObjectKind
    type: string
    semconv: none
    description: The object's kind. Not part of objectRef; never a substitute for resource.
    writers: {request: optional, gateway: not_established, action: optional, controller: optional}

  - name: krateo.audit.object_ref.uid
    go: ObjectUID
    type: string
    semconv: none
    description: >-
      The uid of the object written, as the authority returned it; for a
      controller, of the object it wrote or acted on. A request row's
      object_ref.uid is the join key to the reconciles it caused, whose
      controller rows carry it as krateo.audit.cause_ref.uid.
    writers:
      request: {level: conditional, when: "a successful, non-dry-run write"}
      gateway: not_established
      action: {level: conditional, when: "a successful, non-dry-run write"}
      controller: {level: conditional, when: the object is known}

  - name: krateo.audit.object_ref.resource_version
    go: ObjectResourceVersion
    type: string
    semconv: none
    description: The resourceVersion the authority returned for the write, or the one a controller read.
    writers:
      request: {level: conditional, when: "a successful, non-dry-run write that is not a DELETE"}
      gateway: not_established
      action: {level: conditional, when: "a successful, non-dry-run write that is not a DELETE"}
      controller: optional

  - name: krateo.audit.object_ref.generation
    go: ObjectGeneration
    type: int
    semconv: none
    description: The generation the authority returned for the write, or the one a controller acted on.
    writers:
      request: {level: conditional, when: "a successful, non-dry-run write that is not a DELETE"}
      gateway: not_established
      action: {level: conditional, when: "a successful, non-dry-run write that is not a DELETE"}
      controller: {level: conditional, when: the controller acted on a generation}

  - name: krateo.audit.object_ref.content_sha256
    go: ObjectContentSHA256
    type: string
    semconv: none
    format: content_hash
    description: >-
      The tamper-evidence anchor of a write that creates or replaces content:
      c1:<the lowercase hex SHA-256 of the object's canonical content, form
      c1> (audit.ContentSHA256, docs/schema.md), computed by the writer from
      the request body it sends. A later change of the form is c2, so a
      stored hash is always read with the form that made it. Never on a
      credential-bearing target: a hash of low-entropy secret data can be
      guessed offline.
    only_when: content_write
    credential_free: true
    writers: {request: optional, gateway: not_established, action: optional, controller: optional}

  # --- what a controller reconciled -------------------------------------------
  # A controller row has two objects: object_ref.* is the object it WROTE (the
  # apiserver's objectRef of that write), cause_ref.* the object it reconciled
  # (the custom resource whose reconcile made the write). snowplow joins a
  # controller row to the request that caused it on cause_ref.uid/generation =
  # the request row's object_ref.uid/generation (docs/schema.md).
  - name: krateo.audit.cause_ref.api_group
    go: CauseAPIGroup
    type: string
    semconv: none
    description: The API group of the object the controller reconciled. Omitted for the core group.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the reconciled object is outside the core group}

  - name: krateo.audit.cause_ref.api_version
    go: CauseAPIVersion
    type: string
    semconv: none
    description: The API version of the object the controller reconciled.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the record names a reconciled object, check: caused}

  - name: krateo.audit.cause_ref.resource
    go: CauseResource
    type: string
    semconv: none
    description: The resource, the plural, of the object the controller reconciled.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the record names a reconciled object, check: caused}

  - name: krateo.audit.cause_ref.namespace
    go: CauseNamespace
    type: string
    semconv: none
    description: The namespace of the object the controller reconciled.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the reconciled object is namespaced}

  - name: krateo.audit.cause_ref.name
    go: CauseName
    type: string
    semconv: none
    description: The name of the object the controller reconciled.
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the record names a reconciled object, check: caused}

  - name: krateo.audit.cause_ref.uid
    go: CauseUID
    type: string
    semconv: none
    description: >-
      The uid of the object the controller reconciled, as it read it. Joins
      the row to the request whose write it reconciled (that row's
      krateo.audit.object_ref.uid).
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the record names a reconciled object, check: caused}

  - name: krateo.audit.cause_ref.generation
    go: CauseGeneration
    type: int
    semconv: none
    description: >-
      The generation of the object the controller reconciled, the one this
      reconcile acted on. With cause_ref.uid, joins the row to the request
      that wrote that generation (that row's krateo.audit.object_ref.generation).
    writers:
      request: not_applicable
      gateway: not_applicable
      action: not_applicable
      controller: {level: conditional, when: the reconciled object has a generation (every custom resource has one)}

  # --- which target: an external endpoint -----------------------------------
  - name: server.address
    go: ServerAddress
    type: string
    semconv: stable
    description: The external endpoint the action was sent to, host[:port] only.
    writers:
      request: {level: conditional, when: the target is not a Kubernetes object}
      gateway: required
      action: {level: conditional, when: the target is not a Kubernetes object}
      controller: {level: conditional, when: the controller wrote to an external endpoint}

  # --- the request received -------------------------------------------------
  - name: krateo.request.uri
    go: RequestURI
    type: string
    semconv: none
    identity: true
    description: >-
      The path and query the writer received (Kubernetes requestURI). Never a
      scheme or host.
    writers:
      request: required
      gateway: {level: conditional, when: the gateway proves no credential reaches the URI}
      action: {level: conditional, when: the action was a received request}
      controller: not_applicable

  - name: krateo.request.source_ips
    go: SourceIPs
    type: string[]
    semconv: none
    identity: true
    description: >-
      Kubernetes sourceIPs: forwarded entries, then the TCP peer. Only the
      last entry is established by the writer.
    writers:
      request: required
      gateway: required
      action: {level: conditional, when: the action was a received request}
      controller: not_applicable

  - name: user_agent.original
    go: UserAgent
    type: string
    semconv: stable
    description: The User-Agent header, cut at 1024 bytes with ...TRUNCATED, as the apiserver does.
    writers:
      request: {level: conditional, when: the header was sent}
      gateway: {level: conditional, when: the header was sent}
      action: {level: conditional, when: the header was sent}
      controller: not_applicable

  - name: krateo.request.received_time_unix_nano
    go: RequestReceivedTime
    type: int
    semconv: none
    description: When the request was received (Kubernetes requestReceivedTimestamp), Unix nanoseconds.
    writers: {request: optional, gateway: optional, action: optional, controller: not_applicable}

  - name: session.id
    go: SessionID
    type: string
    semconv: development
    description: >-
      The business/session correlation id from W3C baggage. A correlation
      key a client can set: never identity, never a policy key.
    writers:
      request: required
      gateway: {level: conditional, when: inbound baggage carries it}
      action: {level: conditional, when: inbound baggage carries it}
      controller: not_applicable

  - name: krateo.restaction.namespace
    go: RESTActionNamespace
    type: string
    semconv: none
    description: The namespace of the RESTAction whose stage performed the action.
    writers:
      request: {level: conditional, when: a RESTAction stage record}
      gateway: not_applicable
      action: not_applicable
      controller: not_applicable

  - name: krateo.restaction.name
    go: RESTActionName
    type: string
    semconv: none
    description: The name of the RESTAction whose stage performed the action.
    writers:
      request: {level: conditional, when: a RESTAction stage record}
      gateway: not_applicable
      action: not_applicable
      controller: not_applicable

  - name: krateo.restaction.stage
    go: RESTActionStage
    type: string
    semconv: none
    description: The api[] stage of the RESTAction that performed the action.
    writers:
      request: {level: conditional, when: a RESTAction stage record}
      gateway: not_applicable
      action: not_applicable
      controller: not_applicable

  # --- record annotations ---------------------------------------------------
  - name: krateo.audit.incomplete
    go: Incomplete
    type: string
    semconv: none
    format: marker_list
    description: >-
      The comma-separated markers of the facts this record lacks, in a fixed
      order. A gap is recorded, never hidden.
    writers:
      request: {level: conditional, when: the record has a gap}
      gateway: {level: conditional, when: the record has a gap}
      action: {level: conditional, when: the record has a gap}
      controller: {level: conditional, when: the record has a gap}

  - name: krateo.audit.no_trace_context
    go: NoTraceContext
    type: bool
    semconv: none
    values: ["true"]
    description: true when the record was emitted with no valid span on its context, so it carries no TraceId.
    writers:
      request: {level: conditional, when: no span on the context}
      gateway: {level: conditional, when: no span on the context}
      action: {level: conditional, when: no span on the context}
      controller: {level: conditional, when: no span on the context}

  # --- gateway only ---------------------------------------------------------
  - name: krateo.audit.gateway.route
    go: GatewayRoute
    type: string
    semconv: none
    description: The gateway route the request matched (gateway configuration).
    writers: {request: not_applicable, gateway: required, action: not_applicable, controller: not_applicable}

  - name: krateo.audit.gateway.mcp_tool
    go: GatewayMCPTool
    type: string
    semconv: none
    description: The MCP tool name of an MCP hop.
    writers:
      request: not_applicable
      gateway: {level: conditional, when: an MCP hop}
      action: not_applicable
      controller: not_applicable

  - name: krateo.audit.asserted.agent_host
    go: AssertedAgentHost
    type: string
    semconv: none
    asserted: true
    description: >-
      The client-controlled x-kagent-host header, recorded as an assertion.
      Never an actor identity, never a policy key.
    writers:
      request: not_applicable
      gateway: {level: conditional, when: the header was present}
      action: not_applicable
      controller: not_applicable

  # --- client-asserted provenance (snowplow#1333) ----------------------------
  # What the portal asserted about a write in its X-Krateo-Provenance header,
  # as the writer received it after validating it. Asserted: never identity,
  # actor class, agent identity, outcome or target, which the writer
  # establishes itself. Only on a write; when the writer rejected the header,
  # the record carries krateo.audit.client.rejected and no other client key.
  - name: krateo.audit.client.source
    go: ClientSource
    type: string
    semconv: none
    asserted: true
    values: [portal]
    description: The client that sent the provenance header.
    only_when: write
    not_when: client_rejected
    writers:
      request: {level: conditional, when: the record carries client provenance, check: client_provenance}
      gateway: not_applicable
      action: {level: conditional, when: the record carries client provenance, check: client_provenance}
      controller: not_applicable

  - name: krateo.audit.client.agent_session_id
    go: ClientAgentSessionID
    type: string
    semconv: none
    asserted: true
    format: opaque_id
    description: >-
      The Agentiko session the write was made in, for an agent-initiated
      write: at most 128 of [A-Za-z0-9_-]. An agent's prompt is traced through
      it in Agentiko's own store; no prompt text is carried.
    only_when: write
    not_when: client_rejected
    writers: {request: optional, gateway: not_applicable, action: optional, controller: not_applicable}

  - name: krateo.audit.client.confirmation_id
    go: ClientConfirmationID
    type: string
    semconv: none
    asserted: true
    format: uuid
    description: >-
      One press of the portal's confirm gate, a lowercase UUID: every write
      of one confirmed set carries the same id.
    only_when: write
    not_when: client_rejected
    writers: {request: optional, gateway: not_applicable, action: optional, controller: not_applicable}

  - name: krateo.audit.client.confirmed_set.count
    go: ClientConfirmedSetCount
    type: int
    semconv: none
    asserted: true
    minimum: 1
    description: How many writes the confirmed set holds.
    only_when: write
    not_when: client_rejected
    writers:
      request: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      gateway: not_applicable
      action: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      controller: not_applicable

  - name: krateo.audit.client.confirmed_set.irreversible
    go: ClientConfirmedSetIrreversible
    type: bool
    semconv: none
    asserted: true
    description: true when any write of the confirmed set is irreversible.
    only_when: write
    not_when: client_rejected
    writers:
      request: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      gateway: not_applicable
      action: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      controller: not_applicable

  - name: krateo.audit.client.confirmed_set.sha256
    go: ClientConfirmedSetSHA256
    type: string
    semconv: none
    asserted: true
    format: sha256_hex
    description: >-
      The lowercase hex SHA-256 of the canonical confirmed set (snowplow#1333):
      the blast radius the person confirmed, not its diffs.
    only_when: write
    not_when: client_rejected
    writers:
      request: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      gateway: not_applicable
      action: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      controller: not_applicable

  - name: krateo.audit.client.confirmed_set.op
    go: ClientConfirmedSetOp
    type: int
    semconv: none
    asserted: true
    minimum: 0
    less_than: krateo.audit.client.confirmed_set.count
    description: The index of this write in the confirmed set, from 0.
    only_when: write
    not_when: client_rejected
    writers:
      request: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      gateway: not_applicable
      action: {level: conditional, when: the record names a confirmed set, check: confirmed_set}
      controller: not_applicable

  - name: krateo.audit.client.requested_at
    go: ClientRequestedAt
    type: string
    semconv: none
    asserted: true
    format: rfc3339
    description: >-
      When the client says the person confirmed, an RFC 3339 timestamp from
      the browser's clock. Never the event time.
    only_when: write
    not_when: client_rejected
    writers: {request: optional, gateway: not_applicable, action: optional, controller: not_applicable}

  - name: krateo.audit.client.rejected
    go: ClientRejected
    type: string
    semconv: none
    asserted: true
    values: [oversize, encoding, version, schema]
    description: >-
      The writer rejected the client's provenance header, and why: the header
      was too long, not base64url JSON, of another version, or broke the
      closed schema. The write itself still ran. The record then carries no
      other client key.
    only_when: write
    writers: {request: optional, gateway: not_applicable, action: optional, controller: not_applicable}

  # --- v0.3 names, written side by side during W1, removed when W1 closes ----
  - name: outcome
    go: LegacyOutcome
    type: string
    semconv: none
    values: [success, failure, denied]
    replaced_by: krateo.audit.outcome
    description: The v0.3 name of krateo.audit.outcome.

  - name: enduser.id
    go: LegacyEndUserID
    type: string
    semconv: deprecated
    identity: true
    replaced_by: user.name
    dual_write: false
    description: >-
      The v0.3 copy of user.name; deprecated in semconv. Written only by a
      writer that writes it today (snowplow; a library caller that sets
      Event.EndUserID): Emit never adds it.

  - name: k8s.resource.group
    go: LegacyResourceGroup
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.api_group
    description: The v0.3 name of krateo.audit.object_ref.api_group.

  - name: k8s.resource.version
    go: LegacyResourceVersion
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.api_version
    description: The v0.3 name of krateo.audit.object_ref.api_version.

  - name: k8s.resource.resource
    go: LegacyResourceResource
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.resource
    description: The v0.3 name of krateo.audit.object_ref.resource.

  - name: k8s.resource.subresource
    go: LegacyResourceSubresource
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.subresource
    description: The v0.3 name of krateo.audit.object_ref.subresource.

  - name: k8s.resource.kind
    go: LegacyResourceKind
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.kind
    description: The v0.3 name of krateo.audit.object_ref.kind.

  - name: k8s.resource.name
    go: LegacyResourceName
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.name
    description: The v0.3 name of krateo.audit.object_ref.name.

  - name: k8s.object.uid
    go: LegacyObjectUID
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.uid
    description: The v0.3 name of krateo.audit.object_ref.uid.

  - name: k8s.object.generation
    go: LegacyObjectGeneration
    type: int
    semconv: none
    replaced_by: krateo.audit.object_ref.generation
    description: The v0.3 name of krateo.audit.object_ref.generation.

  - name: k8s.object.resource_version
    go: LegacyObjectResourceVersion
    type: string
    semconv: none
    replaced_by: krateo.audit.object_ref.resource_version
    description: The v0.3 name of krateo.audit.object_ref.resource_version.
